<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Software | Official Portal</title>
    <style>
        :root {
            --bg-color: #080a0f;
            --card-bg: #10141e;
            --accent-color: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.4);
            --text-main: #ffffff;
            --text-sub: #8a93a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at center, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
        }

        .container {
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px var(--accent-glow);
            backdrop-filter: blur(10px);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        h1 span {
            color: var(--accent-color);
        }

        p {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--accent-color);
            color: #000;
            border: none;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--accent-color);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">
            <div class="status-dot"></div> SCRIPT OPERATIVO
        </div>

        <h1>VORTEX <span>SOFTWARE</span></h1>
        <p>Has accedido desde un navegador web. Para usar el script, copia el loader y ejecútalo directamente dentro de tu ejecutor de Roblox.</p>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="copyLoader()">Copiar Loader Script</button>
            <a href="https://discord.gg/Fn74MpzFUn" target="_blank" class="btn btn-secondary">Unirse al Servidor de Discord</a>
        </div>

        <div class="footer-text">
            &copy; 2026 Vortex Software. Todos los derechos reservados.
        </div>
    </div>

    <script>
        function copyLoader() {
            const loaderCode = 'loadstring(game:HttpGet("https://raw.githubusercontent.com/vortex-x-system/vortex-x-scripts/refs/heads/main/Vortex-x-software/Vortex-Loader/Vortex-Official/Vortex.lua"))()';

            // Método seguro compatible con cualquier navegador actual
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(loaderCode).then(() => {
                    alert("¡Loader de Vortex Software copiado al portapapeles!");
                }).catch(() => {
                    fallbackCopyText(loaderCode);
                });
            } else {
                fallbackCopyText(loaderCode);
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";  // Evitar desplazamiento de página
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";
            
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    alert("¡Loader de Vortex Software copiado al portapapeles!");
                } else {
                    alert("No se pudo copiar automáticamente. Selecciónalo manualmente.");
                }
            } catch (err) {
                alert("Error al intentar copiar el texto.");
            }

            document.body.removeChild(textArea);
        }
    </script>

</body>
</html>
